{% extends "base.html" %}

{% block title %}Executive Reports{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 fw-bold mb-0">Executive Reports</h1>
</div>
<div class="row mb-4">
    <div class="col-md-4">
        <div class="card h-100 shadow-sm border-primary">
            <div class="card-body text-center">
                <h6 class="text-uppercase text-muted fw-bold small">Active Task Forces</h6>
                <h2 class="display-4 fw-bold text-primary">{{ active_taskforces_all }}</h2>
                <a href="{% url 'dashboard:dean_reports' %}"
                    class="btn btn-sm btn-outline-primary mt-2">
                    Browse by Department
                </a>
            </div>
        </div>
    </div>
</div>

{% endblock %}
